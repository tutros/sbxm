# How `sbxm task` works on this repo: a worker agent takes a GitHub issue, gates check
# its change, an independent reviewer reads it, and one fix round follows.
# See what would run with: sbxm task gates --issue N --dry-run

[worker]
harness = "claude"             # claude | codex | antigravity
# model = "claude-opus-5-5"    # the harness's default when absent
time_limit = "2h"

# The worker's fix rounds continue its own Claude session (decision 285, a trial; issue 418).
[fix]
resume = true

# The reviewer defaults to a harness different from the worker's.
[reviewer]
# harness = "codex"
# model = "gpt-5.6-sol"
time_limit = "45m"

# Each harness needs its provider's secret stored in sbx (see `sbx secret ls`):
# claude -> anthropic, codex -> openai, antigravity -> google.

[sandbox]
# A profile in your profiles dir (`sbxm config profiles-dir`); required.
profile = "sbxm-dev"
# cpus = 4
# memory = "8g"

# Without [gates] sandbox, a repo with a Cargo.toml gets the three cargo commands below;
# any other repo must list its own. An empty list means no sandbox gates.
[gates]
sandbox = ["cargo fmt --check", "CARGO_PROFILE_DEV_DEBUG=0 CARGO_TARGET_DIR=/tmp/target cargo clippy --all-targets -- -D warnings", "CARGO_PROFILE_DEV_DEBUG=0 CARGO_TARGET_DIR=/tmp/target cargo test --no-fail-fast > /tmp/t.log 2>&1; r=$?; grep -a -E '^error|No space|FAILED|panicked' -A8 /tmp/t.log | head -80; [ $r -ne 0 ] && tail -n 40 /tmp/t.log | cut -c1-300; df -h /tmp | tail -1; exit $r", 'base=$(git merge-base HEAD origin/HEAD 2>/dev/null); if [ -n "$base" ] && git diff --quiet --no-renames "$base" -- scripts && new=$(git ls-files --others --exclude-standard -- scripts) && [ -z "$new" ]; then echo "no change under scripts/: Pester tests not run"; exit 0; fi; just script-test']
# The Pester gate (issue 455) runs `just script-test` only when the change against the default
# branch (origin/HEAD) touches scripts/, and runs it when that base or the change can't be found.
# It selects scripts/ by git pathspec, never by matching git's printed (quoted) file names.
# Optional second tier, run on this machine after the sandbox tier passes. Off while empty.
# WARNING: host gates run agent-written code on this machine, outside any sandbox. List
# only commands you would run on a stranger's pull request.
# host = []
timeout = "20m"                # per command

# The PR risk level is raised to at least this for a change touching these paths (decisions
# 176, 179; case-insensitive substrings, added to the built-in defaults): the git trust boundary,
# the kit (egress, secrets), and the state formats.
[risk]
high = ["src/git.rs", "src/task/repo.rs", "src/kit.rs", "src/task/record.rs", "src/state.rs"]

# How `sbxm task loop` waits out a harness's usage limit: usage_wait before each resume, and
# the loop stops once the waits in a row reach usage_wait_total.
[loop]
usage_wait = "30m"
usage_wait_total = "5h"

# A spec task's `task finish --spec` pushes its branch and opens the PR with the in-task review,
# closing the issues of the spec's `Fixes: #435, #436` line (decision 301, issue 438).
[finish]
sink = "pr"

# Replace a built-in prompt with a file inside this repo:
# [prompts]
# worker = "prompts/worker.md"
# reviewer = "prompts/reviewer.md"
# fix = "prompts/fix.md"
