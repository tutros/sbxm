[package]
name = "sbxm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
dirs = "7.0.0"
fastembed = { version = "7.1.0", default-features = false, features = ["ort-download-binaries-native-tls"] }
fs4 = "1.1.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_norway = "0.9.42"
sha2 = "0.11.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
tempfile = "3.27.0"

# `sbxm` hashes its own executable for every `run.log` header (decision 170), once per process:
# unoptimized, that took 3 s on the debug test binary, paid by every test under nextest's one
# process per test (issue 395).
[profile.dev.package.sha2]
opt-level = 3
