description = "Working on sbxm itself: Rust toolchain matching the host, crates.io egress"

# Egress is deny-by-default: list the hosts sandboxes may reach.
[network]
allow = [
  "archive.ubuntu.com",   # apt: build-essential, pkg-config, libssl-dev (cargo needs a C linker; openssl-sys needs the rest)
  "security.ubuntu.com",
  "sh.rustup.rs",         # rustup installer
  "static.rust-lang.org", # toolchain downloads
  "crates.io",
  "index.crates.io",
  "static.crates.io",
  "packages.microsoft.com",       # PowerShell .deb (template build only, decision 302)
  "www.powershellgallery.com",    # Install-Module Pester (index)
  "cdn.powershellgallery.com",    # Install-Module Pester (package download)
  "cdn.pyke.io",                  # ort-sys fetches ONNX Runtime at build time (fastembed; sha256-pinned in the crate)
]
deny = []

# Environment variables set inside the sandbox.
[env]

# Secret services that must exist in `sbx secret ls`. Values stay in sbx.
[secrets]
services = ["anthropic"]

# The image runs its own `apt-get` at startup (the Claude kit locally, the image itself in the
# cloud), so wait until no `apt-get` runs, polling every 2 s for at most 5 minutes (decision 276,
# issue 337): `update` doesn't wait for the package lists' lock, and DPkg::Lock::Timeout only
# covers dpkg's. The image's download.docker.com source isn't allowed and makes `update` fail;
# Ubuntu's own sources still refresh.
[[setup.install]]
command = "i=0; while pgrep -x apt-get >/dev/null && [ $i -lt 150 ]; do sleep 2; i=$((i+1)); done; apt-get -o DPkg::Lock::Timeout=300 update || true; apt-get -o DPkg::Lock::Timeout=300 install -y build-essential pkg-config libssl-dev"
user = "0"
description = "install a C toolchain, pkg-config and OpenSSL headers for cargo (openssl-sys needs them)"

# Pinned to the host's version so fmt and clippy agree with `just check` there.
# The installer is downloaded to a file and then run, not piped into `sh`: with a pipe, a failed
# download leaves `sh` reading nothing and exiting 0, and the sandbox is created without Rust (issue 209).
[[setup.install]]
command = "curl --proto '=https' --tlsv1.2 -sSf -o /tmp/rustup-init.sh https://sh.rustup.rs && sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain 1.93.0 --component rustfmt,clippy && rm /tmp/rustup-init.sh"
user = "agent"
description = "install Rust 1.93.0 with rustfmt and clippy"

# The script tests (`just script-test`) need PowerShell 7 and Pester 5, pinned to the host's versions (decision
# 302, which brings them back now that templates pay the install once; decision 183 had taken them out).
# Microsoft's apt repo for the image's Ubuntu (26.04) has no powershell package, so this installs the 24.04
# repo's .deb directly; it worked on 26.04 before. Bump the version here when the host's pwsh moves.
[[setup.install]]
command = "curl --proto '=https' --tlsv1.2 -sSfLo /tmp/powershell.deb https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/p/powershell/powershell_7.6.9-1.deb_amd64.deb && apt-get -o DPkg::Lock::Timeout=300 install -y /tmp/powershell.deb && rm /tmp/powershell.deb"
user = "0"
description = "install PowerShell 7.6.9"

[[setup.install]]
command = "pwsh -NoProfile -Command \"Install-Module Pester -RequiredVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck\""
user = "agent"
description = "install Pester 5.5.0"

# Compiled from crates.io (already allowed); pinned to the host's version.
[[setup.install]]
command = ". \"$HOME/.cargo/env\" && cargo install just --locked --version 1.58.0"
user = "agent"
description = "install just 1.58.0"

# Sandboxes come from a prebuilt template (`sbxm template build sbxm-dev --warm <repo>`, milestone 3):
# the install steps and the hosts in [network] are used only while building it. A sandbox created
# from it reaches only the hosts below, plus its harness's own. Strict: without a current template,
# sbxm refuses to create a sandbox instead of installing in it (decision 200).
[template]
strict = true
allow = []
