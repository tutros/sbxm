description = "Working on sbxm itself: Rust toolchain matching the host, crates.io egress"

# Egress is deny-by-default: list the hosts sandboxes may reach.
[network]
allow = [
  "archive.ubuntu.com",   # apt: build-essential (cargo needs a C linker)
  "security.ubuntu.com",
  "sh.rustup.rs",         # rustup installer
  "static.rust-lang.org", # toolchain downloads
  "crates.io",
  "index.crates.io",
  "static.crates.io",
  "packages.microsoft.com",       # PowerShell .deb
  "www.powershellgallery.com",    # Install-Module Pester (index)
  "cdn.powershellgallery.com",    # Install-Module Pester (package download)
  "cdn.pyke.io",                  # ort-sys fetches ONNX Runtime at build time (fastembed; sha256-pinned in the crate)
]
deny = []

# Environment variables set inside the sandbox.
[env]

# Secret services that must exist in `sbx secret ls`. Values stay in sbx.
[secrets]
services = ["anthropic"]

# The Claude kit runs its own `apt-get update` at startup, so wait for its lock. The image's
# download.docker.com source isn't allowed and makes `update` fail; Ubuntu's own sources still refresh.
[[setup.install]]
command = "apt-get -o DPkg::Lock::Timeout=300 update || true; apt-get -o DPkg::Lock::Timeout=300 install -y build-essential"
user = "0"
description = "install a C toolchain for cargo"

# Pinned to the host's version so fmt and clippy agree with `just check` there.
[[setup.install]]
command = "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.93.0 --component rustfmt,clippy"
user = "agent"
description = "install Rust 1.93.0 with rustfmt and clippy"

# The script tests (`just script-test`) need PowerShell 7 and Pester 5, both pinned to the host's versions.
# Microsoft's apt repo for the image's Ubuntu (26.04) has no powershell package, so this installs the 24.04
# repo's .deb directly; it works on 26.04. Bump the version here when the host's pwsh moves.
[[setup.install]]
command = "curl --proto '=https' --tlsv1.2 -sSfLo /tmp/powershell.deb https://packages.microsoft.com/ubuntu/24.04/prod/pool/main/p/powershell/powershell_7.6.6-1.deb_amd64.deb && apt-get -o DPkg::Lock::Timeout=300 install -y /tmp/powershell.deb && rm /tmp/powershell.deb"
user = "0"
description = "install PowerShell 7.6.6"

[[setup.install]]
command = "pwsh -NoProfile -Command \"Install-Module Pester -RequiredVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck\""
user = "agent"
description = "install Pester 5.5.0"

# Compiled from crates.io (already allowed); pinned to the host's version.
[[setup.install]]
command = ". \"$HOME/.cargo/env\" && cargo install just --locked --version 1.58.0"
user = "agent"
description = "install just 1.58.0"
